<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>海大送餐管理端</title>
    <link rel="shortcut icon" href="favicon.ico">
    <!-- 引入样式 -->
    <link rel="stylesheet" href="plugins/element-ui/index.css"/>
    <link rel="stylesheet" href="styles/common.css"/>
    <link rel="stylesheet" href="styles/index.css"/>
    <link rel="stylesheet" href="styles/icon/iconfont.css"/>
    <style>
        .body {
            min-width: 1366px;
        }

        .app-main {
            height: calc(100% - 64px);
        }

        .app-main .divTmp {
            width: 100%;
            height: 100%;
        }

        .menu-badge {
            margin-left: 8px;
        }

        .menu-badge .el-badge__content {
            background-color: #ff4444;
        }
    </style>
</head>

<body>
<div class="app" id="app">
    <div class="app-wrapper openSidebar clearfix">
        <!-- sidebar -->
        <div class="sidebar-container">
            <div class="logo">
                <!-- <img src="images/logo.png" width="122.5" alt="" /> -->
                <img src="images/login/login-logo.png" alt="Logo" style="width: 117px; height: 32px"/>
            </div>

            <el-scrollbar wrap-class="scrollbar-wrapper">
                <el-menu
                        :default-active="defAct"
                        :unique-opened="false"
                        :collapse-transition="false"
                        background-color="#343744"
                        text-color="#bfcbd9"
                        active-text-color="#f4f4f5"
                >
                    <div v-for="item in menuList" :key="item.id">
                        <el-submenu :index="item.id" v-if="item.children && item.children.length>0">
                            <template slot="title">
                                <i class="iconfont" :class="item.icon"></i>
                                <span>{{item.name}}</span>
                            </template>
                            <el-menu-item
                                    v-for="sub in item.children"
                                    :index="sub.id"
                                    :key="sub.id"
                                    @click="menuHandle(sub,false)"
                            >
                                <i :class="iconfont" :class="sub.icon"></i>
                                <span slot="title">{{sub.name}}</span>
                                <el-badge :value="newOrderCount" :hidden="newOrderCount === 0" class="menu-badge" v-if="sub.id === '6'" />
                                <el-badge :value="refundUnreadCount" :hidden="refundUnreadCount === 0" class="menu-badge" style="margin-left:4px;" v-if="sub.id === '6'" />
                            </el-menu-item
                            >
                        </el-submenu>
                        <el-menu-item v-else :index="item.id" @click="menuHandle(item,false)">
                            <i class="iconfont" :class="item.icon"></i>
                            <span slot="title">{{item.name}}</span>
                            <el-badge :value="newOrderCount" :hidden="newOrderCount === 0" class="menu-badge" v-if="item.id === '6'" />
                            <el-badge :value="refundUnreadCount" :hidden="refundUnreadCount === 0" class="menu-badge" style="margin-left:4px;" v-if="item.id === '6'" />
                        </el-menu-item>
                    </div>
                </el-menu>
            </el-scrollbar>
        </div>
        <div class="main-container">
            <!-- <navbar /> -->
            <div class="navbar">
                <div class="head-lable">
              <span v-if="goBackFlag" class="goBack" @click="goBack()"
              ><img src="images/icons/btn_back@2x.png" alt="返回"/> 返回</span
              >
                    <span>{{headTitle}}</span>
                </div>
                <div class="right-menu">
                    <div class="avatar-wrapper">{{ userInfo.name }}</div>
                    <!-- <div class="logout" @click="logout">退出</div> -->
                    <img src="images/icons/btn_close@2x.png" class="outLogin" alt="退出" @click="logout"/>
                </div>
            </div>
            <div class="app-main" v-loading="loading">
                <div class="divTmp" v-show="loading"></div>
                <iframe
                        id="cIframe"
                        class="c_iframe"
                        name="cIframe"
                        :src="iframeUrl"
                        width="100%"
                        height="auto"
                        frameborder="0"
                        v-show="!loading"
                ></iframe>
            </div>
        </div>
    </div>
</div>
<!-- 开发环境版本，包含了有帮助的命令行警告 -->
<script src="plugins/vue/vue.js"></script>
<!-- 引入组件库 -->
<script src="plugins/element-ui/index.js"></script>
<!-- 引入axios -->
<script src="plugins/axios/axios.min.js"></script>
<script src="js/request.js"></script>
<script src="./api/login.js"></script>
<script>

    new Vue({
        el: '#app',
        data() {
            return {
                defAct: '2',
                menuActived: '2',
                userInfo: {},
                menuList: [
                    // {
                    //   id: '1',
                    //   name: '门店管理',
                    //   children: [
                    {
                        id: '2',
                        name: '员工管理',
                        url: 'page/member/list.html',
                        icon: 'icon-member'
                    },
                    {
                        id: '3',
                        name: '分类管理',
                        url: 'page/category/list.html',
                        icon: 'icon-category'
                    },
                    {
                        id: '4',
                        name: '菜品管理',
                        url: 'page/food/list.html',
                        icon: 'icon-food'
                    },
                    {
                        id: '5',
                        name: '套餐管理',
                        url: 'page/combo/list.html',
                        icon: 'icon-combo'
                    },
                    {
                        id: '6',
                        name: '订单明细',
                        url: 'page/order/list.html',
                        icon: 'icon-order'
                    },
                    {
                        id: '7',
                        name: '桌台管理',
                        url: 'page/table/list.html',
                        icon: 'icon-user'
                    },
                    {
                        id: '8',
                        name: '收银台',
                        url: 'page/cashier/index.html',
                        icon: 'icon-order'
                    },
                    {
                        id: '9',
                        name: '公告管理',
                        url: 'page/announcement/list.html',
                        icon: 'icon-category'
                    },
                    {
                        id: '10',
                        name: '门店设置',
                        url: 'page/store/settings.html',
                        icon: 'icon-lock'
                    }
                    //   ],
                    // },
                ],
                iframeUrl: 'page/member/list.html',
                headTitle: '员工管理',
                goBackFlag: false,
                loading: true,
                timer: null,
                newOrderCount: 0,
                pollTimer: null,
                lastNewOrderCount: 0,
                notificationAudio: null,
                refundNotificationsAudio: null,
                firstFetch: true,
                refundUnreadCount: 0,
                prevRefundCount: 0
            }
        },
        computed: {},
        created() {
            const userInfo = window.localStorage.getItem('userInfo')
            if (userInfo) {
                this.userInfo = JSON.parse(userInfo)
            }
            this.closeLoading()
            this.startPolling()
        },
        beforeDestroy() {
            this.timer = null
            clearTimeout(this.timer)
            if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null }
            if (this.refundTimer) { clearInterval(this.refundTimer); this.refundTimer = null }
        },
        mounted() {
            window.menuHandle = this.menuHandle
            this.notificationAudio = new Audio('/backend/audio/notification.mp3')
            this.refundNotificationsAudio = new Audio('/backend/audio/您有新的退款，_br....mp3')
            const unlockAudio = () => {
                this.notificationAudio.play().then(() => { this.notificationAudio.pause(); this.notificationAudio.currentTime = 0 }).catch(() => {})
                this.refundNotificationsAudio.play().then(() => { this.refundNotificationsAudio.pause(); this.refundNotificationsAudio.currentTime = 0 }).catch(() => {})
                document.removeEventListener('click', unlockAudio)
            }
            document.addEventListener('click', unlockAudio)
        },
        methods: {
            logout() {
                logoutApi().then((res) => {
                    if (res.code === 1) { // 当后端返回code=1时退出登录成功
                        localStorage.removeItem('userInfo') // 删除保存作用域中的数据
                        window.location.href = '/backend/page/login/login.html' // 跳转回登录页面
                    }
                })
            },
            // 启动定时轮询，每10秒查询待处理订单数量，每5秒查询退款
            startPolling() {
                this.fetchNewOrderCount()
                this.fetchRefundUnreadCount()
                this.pollTimer = setInterval(() => {
                    this.fetchNewOrderCount()
                }, 10000)
                this.refundTimer = setInterval(() => {
                    this.fetchRefundUnreadCount()
                }, 5000)
            },
            // 查询待处理订单数量
            fetchNewOrderCount() {
                $axios({
                    url: '/order/newCount',
                    method: 'get'
                }).then(res => {
                    if (res.code === 1) {
                        const count = res.data || 0
                        if (this.firstFetch) {
                            this.firstFetch = false
                        } else if (count > this.lastNewOrderCount) {
                            this.alertNewOrder(count)
                        }
                        this.lastNewOrderCount = count
                        this.newOrderCount = count
                    }
                }).catch(() => {
                    // 轮询失败静默处理
                })
            },
            // 新订单提醒：语音 + 横幅
            alertNewOrder(count) {
                // 横幅通知
                this.$notify({
                    title: '新订单提醒',
                    message: '您有 ' + count + ' 个待处理订单，请及时处理',
                    type: 'warning',
                    duration: 5000,
                    position: 'top-right'
                })
                // 播放通知音效
                this.playNotificationSound()
            },
            // 播放通知音效WAV文件
            playNotificationSound() {
                if (this.notificationAudio) {
                    this.notificationAudio.currentTime = 0
                    this.notificationAudio.play().catch(() => {})
                }
            },
            // 查询退款未读数
            fetchRefundUnreadCount() {
                $axios({
                    url: '/order/refundUnreadCount',
                    method: 'get'
                }).then(res => {
                    if (res.code === 1) {
                        const count = res.data || 0
                        if (count > this.prevRefundCount && count > 0) {
                            this.alertNewRefund(count)
                        }
                        this.prevRefundCount = count
                        this.refundUnreadCount = count
                    }
                }).catch(() => {})
            },
            // 新退款提醒：语音 + 横幅
            alertNewRefund(count) {
                this.$notify({
                    title: '退款提醒',
                    message: '您有 ' + count + ' 条退款申请待处理，请及时审核',
                    type: 'warning',
                    duration: 10000,
                    position: 'top-right',
                    onClick: () => { this.menuHandle(this.menuList.find(m => m.id === '6'), false) }
                })
                if (this.refundNotificationsAudio) {
                    this.refundNotificationsAudio.currentTime = 0
                    this.refundNotificationsAudio.play().catch(() => {})
                }
            },
            goBack() {
                // window.location.href = 'javascript:history.go(-1)'
                const menu = this.menuList.find(item => item.id === this.menuActived)
                // this.goBackFlag = false
                // this.headTitle = menu.name
                this.menuHandle(menu, false)
            },
            menuHandle(item, goBackFlag) {
                this.loading = true
                this.menuActived = item.id
                this.iframeUrl = item.url
                this.headTitle = item.name
                this.goBackFlag = goBackFlag
                // 点击"订单明细"时标记退款已读，清红点
                if (item.id === '6') {
                    $axios({ url: '/order/markRefundViewed', method: 'post' }).then(() => {
                        this.refundUnreadCount = 0
                        this.prevRefundCount = 0
                    }).catch(() => {})
                }
                this.closeLoading()
            },
            closeLoading() {
                this.timer = null
                this.timer = setTimeout(() => {
                    this.loading = false
                }, 1000)
            }
        }
    })
</script>
</body>
</html>
